<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License To Name Staff</title>
    <link rel="stylesheet" href="/style.css">
    <link id="favicon" rel="icon" href="/favicons/frame0.png" type="image/png">
</head>
<body>

    <div id="topbar-container"></div>

    <h1>Staff Team</h1>

    <section class="forum-post staff-page" aria-labelledby="staff-title">
        <h2 id="staff-title">Official Staff Directory</h2>
        <p class="staff-intro">Meet the team behind License To Name. Portraits, names, and roles will be listed here.</p>

        <div class="staff-grid" aria-live="polite">
            <article class="staff-card">
                <img class="staff-portrait" src="/staff/images/dale-dribble.jpg" alt="Portrait of Dale Dribble">
                <h3>Dale Dribble</h3>
                <p class="staff-role">IT Specialist</p>
                <p class="staff-bio">Keeps the servers humming, the backups intact, and somehow fixes issues before anyone files a ticket.</p>
            </article>
        </div>
    </section>

    <div class="footer">
        Powered by License To Name Bot
    </div>

    <script src="/components/loadComponents.js"></script>
    <script src="/components/animatedFavicon.js"></script>
</body>
</html>
